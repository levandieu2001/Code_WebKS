<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="css/password-toggle.css?v=1">
    <script src="js/password-toggle.js?v=1" defer></script>
    <script src="js/stay-dates.js?v=1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỗ nghỉ | LOCALMATE</title>
    <meta name="description" content="Xem chi tiết chỗ nghỉ: ảnh thật, tiện nghi, vị trí, mức huỷ và đánh giá của khách đã ở.">
    <link rel="icon" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ══ Trang một chỗ nghỉ ══
   Thứ tự trên trang theo đúng thứ tự khách quyết định: nhìn ảnh → xem giá và
   còn phòng không → đọc tiện nghi → xem người khác nói gì → mới bấm đặt. */
.cn-wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 90px; }

.cn-back { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 16px;
    font-size: 14px; font-weight: 600; color: var(--lm-muted, #7a879c); text-decoration: none; }
.cn-back:hover { color: var(--lm-blue, #0f6fd0); }

.cn-head h1 { font-size: clamp(24px, 3.6vw, 34px); margin: 0 0 8px; color: var(--lm-ink, #16233a); }
.cn-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
    font-size: 14px; color: var(--lm-muted, #7a879c); margin-bottom: 18px; }
.cn-meta span { display: inline-flex; align-items: center; gap: 6px; }
.cn-meta i, .cn-meta svg { width: 15px; height: 15px; }
.cn-sao { color: #e8a33d; font-weight: 700; }
.cn-tag { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px;
    background: var(--lm-blue-soft, #eaf4fe); color: var(--lm-blue, #0f6fd0); }
.cn-tag.het { background: #f1f3f6; color: #7a879c; }
.cn-tag.xac-minh { background: rgba(22,163,74,.12); color: #128a3e; }

/* Thư viện ảnh: một ảnh lớn, các ảnh còn lại thành dải bấm chuyển */
.cn-anh-lon { position: relative; border-radius: var(--lm-r-lg, 20px); overflow: hidden;
    background: #0d1117; aspect-ratio: 16/9; }
.cn-anh-lon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cn-dai { display: flex; gap: 9px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.cn-dai button { flex: 0 0 96px; height: 68px; border-radius: 11px; overflow: hidden;
    border: 2px solid transparent; padding: 0; cursor: pointer; background: none; }
.cn-dai button.dang-xem { border-color: var(--lm-blue, #0f6fd0); }
.cn-dai img { width: 100%; height: 100%; object-fit: cover; display: block; }

.cn-cot { display: grid; grid-template-columns: 1fr 340px; gap: 28px; margin-top: 28px; align-items: start; }
@media (max-width: 900px) { .cn-cot { grid-template-columns: 1fr; } }

.cn-khoi { margin-bottom: 30px; }
.cn-khoi h2 { font-size: 19px; margin: 0 0 12px; color: var(--lm-ink, #16233a); }
.cn-khoi p { line-height: 1.85; color: var(--lm-body, #46536b); margin: 0 0 12px; }

.cn-tien-nghi { display: flex; flex-wrap: wrap; gap: 9px; }
.cn-tien-nghi span { display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: 11px; font-size: 14px;
    background: var(--lm-bg-soft, #f6f9fd); border: 1px solid var(--lm-line, #e3e9f2);
    color: var(--lm-body, #46536b); }

/* Ô đặt phòng dính bên phải */
.cn-dat { position: sticky; top: 90px; background: #fff;
    border: 1px solid var(--lm-line, #e3e9f2); border-radius: var(--lm-r-lg, 20px);
    padding: 22px; box-shadow: var(--lm-shadow-lg, 0 12px 40px rgba(18,38,63,.13)); }
@media (max-width: 900px) { .cn-dat { position: static; } }
.cn-gia { font-size: 27px; font-weight: 800; color: var(--lm-orange, #ff7a2f); }
.cn-gia small { font-size: 14px; font-weight: 600; color: var(--lm-muted, #7a879c); }
.cn-dat-nut { width: 100%; margin-top: 16px; padding: 15px; font-size: 15.5px; }
.cn-dat-nut[disabled] { opacity: .5; cursor: not-allowed; }
.cn-huy { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--lm-line, #e3e9f2);
    font-size: 12.8px; line-height: 1.7; color: var(--lm-muted, #7a879c); }
.cn-huy b { color: var(--lm-ink, #16233a); }
.cn-goi { display: flex; align-items: center; gap: 9px; margin-top: 14px;
    font-size: 13.5px; color: var(--lm-body, #46536b); }
.cn-goi a { color: var(--lm-blue, #0f6fd0); font-weight: 700; text-decoration: none; }

/* Đánh giá */
.cn-tong-sao { display: flex; flex-wrap: wrap; gap: 26px; align-items: center;
    padding: 18px 20px; border-radius: 16px; background: var(--lm-bg-soft, #f6f9fd);
    border: 1px solid var(--lm-line, #e3e9f2); margin-bottom: 18px; }
.cn-diem { font-size: 36px; font-weight: 800; line-height: 1; color: var(--lm-ink, #16233a); }
.cn-diem small { display: block; font-size: 12.5px; font-weight: 500; margin-top: 5px;
    color: var(--lm-muted, #7a879c); }
.cn-pho { flex: 1; min-width: 200px; }
.cn-hang { display: flex; align-items: center; gap: 9px; font-size: 12.5px; margin-bottom: 4px; }
.cn-hang .lb { width: 26px; color: var(--lm-muted, #7a879c); }
.cn-hang .bar { flex: 1; height: 6px; border-radius: 999px; background: #e3e9f2; overflow: hidden; }
.cn-hang .bar i { display: block; height: 100%; background: #e8a33d; }
.cn-hang .n { width: 22px; text-align: right; color: var(--lm-muted, #7a879c); }

.cn-dg { padding: 16px 0; border-bottom: 1px solid var(--lm-line, #e3e9f2); }
.cn-dg:last-child { border-bottom: 0; }
.cn-dg-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 13px; color: var(--lm-muted, #7a879c); }
.cn-dg-cmt { margin: 9px 0 0; line-height: 1.8; color: var(--lm-body, #46536b); }
.cn-dg-rep { margin-top: 11px; padding: 12px 14px; border-radius: 12px;
    background: var(--lm-bg-soft, #f6f9fd); font-size: 13.5px; line-height: 1.7; }
.cn-dg-rep b { color: var(--lm-blue, #0f6fd0); }

.cn-trong { padding: 30px 20px; text-align: center; color: var(--lm-muted, #7a879c);
    background: var(--lm-bg-soft, #f6f9fd); border-radius: 16px; line-height: 1.75; }
.cn-tai { padding: 60px 20px; text-align: center; color: var(--lm-muted, #7a879c); }
</style>
</head>
<body class="lm">

<header class="lm-nav" id="main-nav">
    <div class="lm-nav-inner">
        <a href="index.html" class="lm-logo"><img src="/assets/logo-ngang.png" alt="LOCALMATE"></a>
        <nav class="lm-links" id="main-nav-links">

            <a href="phongnghi.html" class="active" data-i18n="nav_stay">Chỗ nghỉ</a>

            <a href="lienhe.html" data-i18n="nav_contact">Liên hệ</a>
        </nav>
        <div class="lm-nav-right nav-actions">
            <button class="lm-menu-btn" onclick="document.getElementById('lm-drawer').classList.toggle('open')" aria-label="Menu">
                <i data-lucide="menu"></i>
            </button>
            <button class="nav-icon-btn nav-bot-btn" onclick="chatbotWidget.toggle()" title="Trợ lý ảo LOCALMATE">
                <img src="assets/chatbot.png" alt="Bot">
            </button>
            <a href="doitac.html" class="lm-btn lm-btn-cta btn-book-nav">
                <i data-lucide="store"></i><span data-i18n="nav_partner_cta">Đăng chỗ của bạn</span>
            </a>
        </div>
    </div>
    <div class="lm-drawer" id="lm-drawer">
        <a href="index.html" data-i18n="nav_home">Trang chủ</a>
        <a href="phongnghi.html" data-i18n="nav_stay">Chỗ nghỉ</a>
        <a href="dacsan.html" data-i18n="nav_food">Đặc sản</a>
        <a href="khampha.html" data-i18n="nav_dest">Điểm đến</a>
        <a href="doitac.html" data-i18n="nav_partner">Đối tác</a>
        <a href="lienhe.html" data-i18n="nav_contact">Liên hệ</a>
    </div>
</header>

<main class="cn-wrap">
    <a href="phongnghi.html" class="cn-back"><i data-lucide="arrow-left"></i> Về danh sách chỗ nghỉ</a>
    <div id="cn-body"><div class="cn-tai">Đang tải chỗ nghỉ…</div></div>
</main>

<!-- Ô đặt phòng: dùng ĐÚNG bộ lớp của trang danh sách.
     booking.js chỉ bật/tắt lớp "hidden" trên #service-modal, phần khung và
     nút đóng là do CSS của styles.css vẽ. Đặt tên lớp khác đi thì ô đặt vẫn
     mở nhưng không có nền mờ, không có nút đóng — hỏng mà không báo lỗi. -->
<div id="service-modal" class="modal-overlay hidden" onclick="BayNuiBooking.close(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="BayNuiBooking.close()" aria-label="Đóng"><i data-lucide="x"></i></button>
        <div id="service-modal-body"></div>
    </div>
</div>

<div id="toast" class="toast"><div><i data-lucide="check-circle"></i></div><span id="toast-msg"></span></div>

</body>
