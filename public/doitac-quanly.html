<!DOCTYPE html>
<html lang="vi">
<head>
<style>
@media(max-width:640px){
    #or-table,#or-table tbody,#or-table tr,#or-table td{display:block;width:100%;min-width:0}
    #or-table thead{display:none}
    #or-table tr{padding:12px;border-bottom:2px solid #e3e9f2}
    #or-table td{border:0;padding:6px 0;text-align:left;white-space:normal;overflow-wrap:anywhere}
    #or-table td::before{display:block;font-size:12px;color:#65758b;font-weight:700}
    #or-table td:nth-child(1)::before{content:'Ngày'}
    #or-table td:nth-child(2)::before{content:'Mã đơn'}
    #or-table td:nth-child(3)::before{content:'Khách'}
    #or-table td:nth-child(4)::before{content:'Nội dung'}
    #or-table td:nth-child(5)::before{content:'Giá trị'}
    #or-table .pw-acts{flex-wrap:wrap}
    #or-table button{min-height:44px}
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kênh đối tác | LOCALMATE</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="css/styles.css?v=11">
<link rel="stylesheet" href="css/localmate.css?v=18">
<link rel="stylesheet" href="css/enhancements.css?v=3">
<!-- partner.css chứa toàn bộ định dạng thẻ tin đăng (.listing-card, form đăng,
     thư viện ảnh). Thiếu file này thì phần đăng phòng hiện ra trần trụi như
     HTML thô — chữ dính vào nhau, nút thành nút mặc định của trình duyệt. -->
<link rel="stylesheet" href="css/partner.css?v=11">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ════════════════════════════════════════════════════
   KÊNH ĐỐI TÁC
   ════════════════════════════════════════════════════
   Trang làm việc hằng ngày của khách sạn / nhà xe / đơn vị tour.
   Tách khỏi doitac.html (trang giới thiệu & đăng ký) vì hai việc khác hẳn
   nhau: một bên để thuyết phục người ta tham gia, một bên để người đã tham
   gia ngồi làm việc. Nhét chung thì cả hai đều rối. */

.pw-shell { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }
@media (max-width: 900px) { .pw-shell { grid-template-columns: 1fr; } }

.pw-side {
    background: var(--forest, #1D2214); color: #fff;
    padding: 26px 18px; display: flex; flex-direction: column; gap: 6px;
}
@media (max-width: 900px) {
    .pw-side { flex-direction: row; overflow-x: auto; padding: 12px; gap: 8px; }
}
.pw-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
@media (max-width: 900px) { .pw-brand { display: none; } }
.pw-brand-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: block; object-fit: cover;
}
.pw-brand b { display: block; font-family: var(--font-display); font-size: 17px; }
.pw-brand small { font-size: 11px; opacity: .6; letter-spacing: .08em; }

.pw-nav {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 12px 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: transparent; color: rgba(255,255,255,.72);
    font: inherit; font-size: 14.5px; font-weight: 600; text-align: left;
    white-space: nowrap;
}
.pw-nav:hover { background: rgba(255,255,255,.07); color: #fff; }
.pw-nav.active { background: var(--terracotta); color: #fff; }
.pw-nav svg { width: 18px; height: 18px; }
/* Muc an di phai an that.
   .pw-nav dat display:flex, ma quy tac nay manh hon [hidden]{display:none}
   cua trinh duyet — nen truoc day khach san van thay muc "Lich khoi hanh",
   bam vao thi ra trang bao loi. Chi don vi tour moi co lich khoi hanh. */
.pw-nav[hidden] { display: none; }
/* Duong ve trang doi tac: truoc day mo hai lan — opacity .5 cua khoi CHONG
   LEN mau chu rgba(...,.55) cua the a, thanh ra chi con hon mot phan tu do
   dam. Tren nen xanh dam gan nhu khong doc duoc. Gio de mot muc do dam duy
   nhat va cho no hinh hai mot cai nut. */
.pw-side-foot { margin-top: auto; padding-top: 14px; }
.pw-side-foot a {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px;
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 10px;
    color: rgba(255, 255, 255, .88);
    font-size: 13px; font-weight: 600;
    transition: background .18s, border-color .18s, color .18s;
}
.pw-side-foot a:hover {
    background: rgba(255, 255, 255, .12);
    border-color: rgba(255, 255, 255, .4);
    color: #fff;
}
@media (max-width: 900px) { .pw-side-foot { display: none; } }

.pw-main { padding: 30px 32px 60px; background: var(--surface-2); }
@media (max-width: 640px) { .pw-main { padding: 20px 16px 50px; } }

.pw-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; }
.pw-head h1 { margin: 4px 0 4px; font-size: clamp(24px, 3vw, 32px); }
.pw-head p { margin: 0; color: var(--muted); font-size: .94rem; max-width: 640px; line-height: 1.6; }
.pw-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700;
}
.pw-badge.ok { background: rgba(62,124,89,.14); color: var(--moss); }
.pw-badge.wait { background: rgba(198,113,57,.14); color: var(--terracotta); }

.pw-page { display: none; }
.pw-page.active { display: block; }

.pw-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px,100%), 1fr)); gap: 14px; }
.pw-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.pw-card .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pw-card .v { font-family: var(--font-display); font-size: 26px; margin-top: 4px; }
.pw-card .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pw-card.dark { background: var(--forest, #1D2214); border-color: transparent; }
.pw-card.dark .k { color: rgba(255,255,255,.6); }
.pw-card.dark .v { color: var(--gold, #D7B46A); }
.pw-card.dark .s { color: rgba(255,255,255,.5); }

.pw-note {
    margin: 18px 0 0; padding: 15px 18px; border-radius: 14px;
    background: var(--leaf); border: 1px solid rgba(143,160,115,.4);
    font-size: .9rem; line-height: 1.7;
}
.pw-block { margin-top: 30px; }
.pw-block h2 { font-size: 1.15rem; margin: 0 0 12px; }

.pw-table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.pw-table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 640px; }
.pw-table th {
    text-align: left; padding: 13px 16px; font-size: 11.5px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid var(--line);
}
.pw-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pw-table tr:last-child td { border-bottom: 0; }
.pw-table .num { text-align: right; white-space: nowrap; }
.pw-in { color: var(--moss); font-weight: 700; }
.pw-out { color: var(--terracotta); font-weight: 700; }
.pw-empty { padding: 30px 20px; text-align: center; color: var(--muted); font-size: .92rem; }
.pw-code { padding: 2px 7px; border-radius: 5px; background: var(--leaf); font-size: .85rem; }

.pw-period { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.pw-period input {
    padding: 9px 13px; font: inherit; font-size: .9rem;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface);
}

/* ── Lịch khởi hành (chỉ đơn vị tour) ──────────────────
   Mỗi chuyến là một thẻ chứ không phải một dòng bảng: đơn vị tour cần nhìn
   thấy NGAY còn thiếu mấy khách và ai đã đăng ký, chứ không phải bấm mở từng
   dòng ra xem. Bảng hợp với tiền, thẻ hợp với việc phải làm. */
.dep-tools {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 20px;
}
.dep-tools label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.dep-tools select, .dep-tools input {
    padding: 9px 12px; font: inherit; font-size: .9rem;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.dep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px,100%), 1fr)); gap: 16px; }
.dep-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.dep-card.done { opacity: .62; }
.dep-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dep-date { font-family: var(--font-display); font-size: 20px; }
.dep-tour { font-size: .88rem; color: var(--muted); margin-top: 2px; }
.dep-bar { height: 8px; border-radius: 99px; background: var(--leaf); overflow: hidden; margin: 14px 0 7px; }
.dep-bar i { display: block; height: 100%; background: var(--terracotta); }
.dep-bar i.full { background: var(--moss); }
.dep-meta { font-size: .86rem; color: var(--muted); line-height: 1.6; }
.dep-guests { margin-top: 13px; border-top: 1px dashed var(--line); padding-top: 11px; }
.dep-guest { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: .9rem; }
.dep-guest a { color: var(--terracotta); font-weight: 600; text-decoration: none; }
.dep-acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.dep-btn {
    padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface-2); font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer;
}
.dep-btn.go { background: var(--moss); border-color: var(--moss); color: #fff; }
.dep-btn.stop { color: var(--terracotta); }

.pw-gate { max-width: 460px; margin: 60px auto; text-align: center; }
.pw-gate h2 { font-size: 1.4rem; margin: 0 0 8px; }
.pw-gate p { color: var(--muted); line-height: 1.7; }

/* ══════════════════════════════════════════════
   CÁC MỤC MỚI CỦA KÊNH ĐỐI TÁC
   ══════════════════════════════════════════════ */

/* ── Chuông thông báo ── */
.pw-bell-wrap { position: relative; }
.pw-bell {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; display: grid; place-items: center; position: relative;
    color: var(--ink-2, #3a3733);
}
.pw-bell:hover { border-color: var(--terracotta); color: var(--terracotta); }
.pw-bell svg { width: 19px; height: 19px; }
.pw-bell-dot {
    position: absolute; top: -5px; right: -5px;
    min-width: 19px; height: 19px; padding: 0 4px; border-radius: 999px;
    background: #d64545; border: 2px solid var(--surface); color: #fff;
    font-size: 10px; font-weight: 800; line-height: 15px; text-align: center;
}
.pw-bell-panel {
    position: absolute; right: 0; top: 52px; z-index: 40;
    width: min(380px, calc(100vw - 40px));
    max-height: 440px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 18px 44px rgba(20,18,16,.16);
}
.pw-bell-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--surface); border-radius: 16px 16px 0 0;
}
.pw-bell-head button {
    border: 0; background: none; cursor: pointer; font: inherit;
    font-size: 12.5px; color: var(--terracotta); font-weight: 600;
}
.pw-tin { padding: 13px 16px; border-bottom: 1px solid var(--line); }
.pw-tin:last-child { border-bottom: 0; }
.pw-tin.moi { background: rgba(198,113,57,.05); }
.pw-tin.clickable {
    display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line);
    text-align: left; color: inherit; font: inherit; cursor: pointer;
}
.pw-tin.clickable:hover, .pw-tin.clickable:focus-visible {
    background: rgba(198,113,57,.11); outline: none;
}
.pw-tin b { display: block; font-size: 13.5px; margin-bottom: 3px; }
.pw-tin p { margin: 0; font-size: 12.8px; color: var(--muted); line-height: 1.55; }
.pw-tin time { display: block; margin-top: 5px; font-size: 11.5px; color: var(--muted); opacity: .75; }
.pw-tin-open { display: block; margin-top: 7px; font-size: 12px; font-weight: 700; color: var(--terracotta); }

@keyframes pw-order-focus {
    0%, 45% { box-shadow: inset 5px 0 #ff7a32; background: #fff3e8; }
    100% { box-shadow: inset 5px 0 transparent; background: transparent; }
}
.pw-table tr.pw-order-focus { scroll-margin: 130px 0; }
.pw-table tr.pw-order-focus td { animation: pw-order-focus 3.2s ease-out both; }

/* Chấm đỏ trên mục menu bên trái */
.pw-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b;
    margin-left: auto; flex: none;
}

/* ── Thanh công cụ: bộ lọc + ô tìm ── */
.pw-tools {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.pw-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.pw-chip {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 8px 15px; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
}
.pw-chip:hover { border-color: var(--terracotta); color: var(--terracotta); }
.pw-chip.active { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
.pw-chip .n { opacity: .7; font-weight: 500; }
.pw-search {
    flex: 1 1 260px; max-width: 380px;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 13.5px; background: var(--surface);
}

/* ── Nút thao tác trong bảng đơn ── */
.pw-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pw-btn {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 9px; padding: 7px 12px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pw-btn:hover { border-color: currentColor; }
.pw-btn.go { color: #2f7a4f; border-color: rgba(47,122,79,.4); }
.pw-btn.go:hover { background: rgba(47,122,79,.08); }
.pw-btn.stop { color: #c0392b; border-color: rgba(192,57,43,.35); }
.pw-btn.stop:hover { background: rgba(192,57,43,.07); }
.pw-btn.done { color: #2b6cb0; border-color: rgba(43,108,176,.35); }
.pw-btn.done:hover { background: rgba(43,108,176,.07); }
.pw-btn[disabled] { opacity: .45; cursor: default; }

/* Nhãn trạng thái đơn */
.pw-tt { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pw-tt.pending { color: #b7791f; }
.pw-tt.confirmed { color: #2b6cb0; }
.pw-tt.completed { color: #2f7a4f; }
.pw-tt.cancelled { color: #a0aec0; }

/* ── Biểu đồ cột theo ngày ──
   Vẽ bằng div, không nạp thư viện: mỗi cột là một ngày, chiều cao theo tỉ lệ
   với ngày cao nhất. Thư viện biểu đồ nặng hơn cả trang này mà cũng chỉ để vẽ
   ba mươi cái cột. */
.pw-chart {
    display: flex; align-items: flex-end; gap: 3px;
    height: 170px; padding: 14px 16px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    overflow-x: auto;
}
.pw-bar { flex: 1 1 0; min-width: 9px; display: flex; flex-direction: column;
          justify-content: flex-end; height: 100%; position: relative; }
.pw-bar i {
    display: block; width: 100%; border-radius: 4px 4px 0 0;
    background: var(--terracotta); opacity: .82; min-height: 2px;
}
.pw-bar:hover i { opacity: 1; }
.pw-bar.trong i { background: var(--line); opacity: 1; }
.pw-chart-x {
    display: flex; gap: 3px; padding: 6px 16px 0;
    font-size: 10.5px; color: var(--muted);
}
.pw-chart-x span { flex: 1 1 0; min-width: 9px; text-align: center; }
.pw-chart-foot {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-top: 10px; font-size: 12.5px; color: var(--muted);
}

/* Mũi tên tăng / giảm trên thẻ số */
.pw-delta { font-size: 12.5px; font-weight: 700; }
.pw-delta.up { color: #2f7a4f; }
.pw-delta.down { color: #c0392b; }
.pw-delta.flat { color: var(--muted); }

.pw-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px,100%),1fr));
          gap: 20px; margin-top: 30px; }
/* Hai bang nho trong cot hep: bo be rong toi thieu 640px cua bang lon, khong
   thi bang hai cot cung sinh ra thanh cuon ngang vo co. */
.pw-two .pw-table { min-width: 0; }

/* ── Đánh giá ── */
.pw-rvw-filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.pw-rvw {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 12px;
}
.pw-rvw-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pw-sao { color: #e8a33d; letter-spacing: 2px; font-size: 15px; }
.pw-rvw-who { font-size: 13px; color: var(--muted); }
.pw-rvw-cmt { margin: 10px 0 0; line-height: 1.65; font-size: 14px; }
.pw-rvw-rep {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--surface-2); font-size: 13.5px; line-height: 1.6;
}
.pw-rvw-rep b { color: var(--terracotta); }
.pw-rvw-form { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.pw-rvw-form textarea {
    flex: 1 1 260px; min-height: 62px; resize: vertical;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 13.5px;
}
.pw-stars-row { display: flex; align-items: center; gap: 9px; font-size: 13px; margin-bottom: 6px; }
.pw-stars-row .lb { width: 34px; color: var(--muted); }
.pw-stars-row .bar { flex: 1; height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.pw-stars-row .bar i { display: block; height: 100%; background: #e8a33d; }
.pw-stars-row .n { width: 26px; text-align: right; color: var(--muted); }

/* ── Lịch phòng ── */
.cal-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; font-size: 12.8px; color: var(--muted); }
.cal-legend span { display: flex; align-items: center; gap: 7px; }
.cal-legend i { width: 13px; height: 13px; border-radius: 4px; display: block; border: 1px solid var(--line); }
.cal-legend i.open { background: var(--surface); }
.cal-legend i.booked { background: #2b6cb0; border-color: #2b6cb0; }
.cal-legend i.closed { background: #cbd5e0; border-color: #cbd5e0; }
.cal-legend i.partial { background: #bfd9f2; border-color: #7fb2e5; }

.cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px;
}
.cal-head {
    text-align: center; font-size: 11.5px; font-weight: 700;
    color: var(--muted); padding-bottom: 6px; letter-spacing: .04em;
}
.cal-o {
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    min-height: 74px; padding: 7px 8px; cursor: pointer; text-align: left;
    font: inherit; display: flex; flex-direction: column; gap: 3px;
    transition: border-color .15s, background .15s;
}
.cal-o:hover:not(:disabled) { border-color: var(--terracotta); }
.cal-o .n { font-size: 14px; font-weight: 700; }
.cal-o .t { font-size: 10.5px; line-height: 1.35; }
.cal-o.trong-thang { visibility: hidden; }
.cal-o.qua { background: var(--surface-2); color: var(--muted); cursor: default; opacity: .65; }
.cal-o.booked { background: #2b6cb0; border-color: #2b6cb0; color: #fff; cursor: default; }
.cal-o.booked .t { opacity: .9; }
.cal-o.closed { background: #cbd5e0; border-color: #cbd5e0; color: #2d3748; }
/* Con phong: xanh nhat, phan biet voi kin sach (xanh dam) va trong (trang) */
.cal-o.partial { background: #eaf4fe; border-color: #7fb2e5; color: #14395e; }
.cal-o.chon { outline: 2.5px solid var(--terracotta); outline-offset: -2px; }

.cal-acts {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-top: 16px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.cal-acts .dem { font-size: 13.5px; font-weight: 600; }
@media (max-width: 560px) {
    .cal-o { min-height: 56px; padding: 5px; }
    .cal-o .t { display: none; }
}

/* ── Hồ sơ ── */
.pw-form { background: var(--surface); border: 1px solid var(--line);
           border-radius: 18px; padding: 22px; margin-bottom: 20px; }
.pw-form h2 { font-size: 1.1rem; margin: 0 0 4px; }
.pw-form > p { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.pw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px,100%),1fr)); gap: 14px; }
.pw-f label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
.pw-f input, .pw-f textarea, .pw-f select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 11px; font: inherit; font-size: 14px; background: var(--surface);
}
.pw-f small { display: block; margin-top: 5px; font-size: 11.8px; color: var(--muted); line-height: 1.5; }
.pw-f.khoa input { background: var(--surface-2); color: var(--muted); }
.pw-save { margin-top: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pw-msg { font-size: 13px; }
.pw-msg.ok { color: #2f7a4f; }
.pw-msg.loi { color: #c0392b; }
</style>
</head>
<body class="lm">
<div class="pw-shell">
    <aside class="pw-side">
        <div class="pw-brand">
            <img src="/assets/logo.png" alt="LOCALMATE" class="pw-brand-icon">
            <div><b>Kênh đối tác</b><small>LOCALMATE</small></div>
        </div>

        <button class="pw-nav active" data-page="overview" onclick="PartnerWorkspace.go('overview', this)">
            <i data-lucide="layout-dashboard"></i>Tổng quan</button>
        <button class="pw-nav" data-page="listings" onclick="PartnerWorkspace.go('listings', this)">
            <i data-lucide="bed-double"></i><span id="pw-nav-listings">Phòng của tôi</span></button>
        <button class="pw-nav" data-page="departures" id="pw-nav-departures" hidden
                onclick="PartnerWorkspace.go('departures', this)">
            <i data-lucide="calendar-days"></i>Lịch khởi hành</button>
        <button class="pw-nav" data-page="calendar" id="pw-nav-calendar" hidden
                onclick="PartnerWorkspace.go('calendar', this)">
            <i data-lucide="calendar-check-2"></i>Lịch phòng</button>
        <button class="pw-nav" data-page="orders" onclick="PartnerWorkspace.go('orders', this)">
            <i data-lucide="receipt-text"></i>Đơn khách đặt</button>
        <button class="pw-nav" data-page="revenue" onclick="PartnerWorkspace.go('revenue', this)">
            <i data-lucide="trending-up"></i>Doanh thu</button>
        <button class="pw-nav" data-page="money" onclick="PartnerWorkspace.go('money', this)">
            <i data-lucide="wallet"></i>Dòng tiền</button>
        <button class="pw-nav" data-page="reviews" onclick="PartnerWorkspace.go('reviews', this)">
            <i data-lucide="star"></i>Đánh giá<span class="pw-dot" id="pw-dot-reviews" hidden></span></button>
        <button class="pw-nav" data-page="profile" onclick="PartnerWorkspace.go('profile', this)">
            <i data-lucide="user-cog"></i>Hồ sơ &amp; nhận tiền</button>

        <div class="pw-side-foot">
            <a href="doitac.html">← Về trang đối tác</a>
        </div>
    </aside>

    <main class="pw-main">
        <div id="pw-gate" class="pw-gate">
            <h2>Đang kiểm tra tài khoản…</h2>
            <p>Chờ một chút nhé.</p>
        </div>

        <div id="pw-body" hidden>
            <header class="pw-head">
                <div>
                    <span class="pw-badge ok" id="pw-status">Đã duyệt</span>
                    <h1 id="pw-name">—</h1>
                    <p id="pw-sub"></p>
                </div>

                <!-- Chuông thông báo.
                     Đối tác không ngồi canh màn hình cả ngày. Có đơn mới, có
                     đánh giá mới, LOCALMATE vừa chuyển tiền — không có chỗ
                     nào báo thì họ chỉ biết khi tình cờ mở trang. -->
                <div class="pw-bell-wrap">
                    <button class="pw-bell" id="pw-bell" onclick="PartnerWorkspace.moChuong()"
                            aria-label="Thông báo">
                        <i data-lucide="bell"></i>
                        <span class="pw-bell-dot" id="pw-bell-dot" hidden></span>
                    </button>
                    <div class="pw-bell-panel" id="pw-bell-panel" hidden>
                        <div class="pw-bell-head">
                            <b>Thông báo</b>
                            <button onclick="PartnerWorkspace.docHet()">Đánh dấu đã đọc</button>
                        </div>
                        <div id="pw-bell-list"></div>
                    </div>
                </div>
            </header>

            <!-- ── Tổng quan ── -->
            <section class="pw-page active" id="page-overview">
                <div class="pw-cards" id="ov-cards"></div>
                <div class="pw-note" id="ov-note"></div>
                <div class="pw-block">
                    <h2>Đơn gần đây</h2>
                    <div class="pw-table-wrap"><table class="pw-table" id="ov-orders"></table></div>
                </div>
            </section>

            <!-- ── Phòng / dịch vụ ── -->
            <section class="pw-page" id="page-listings">
                <div id="listing-panel"></div>
            </section>

            <!-- ── Lịch khởi hành (đơn vị tour) ── -->
            <section class="pw-page" id="page-departures">
                <div class="dep-tools" id="dep-tools"></div>
                <div class="pw-note" id="dep-note"></div>
                <div class="dep-grid" id="dep-list" style="margin-top:18px"></div>
            </section>

            <!-- ── Lịch phòng ──
                 Công tắc "còn / hết" dùng chung cho mọi ngày là quá thô: nghỉ
                 ba hôm mà phải tắt cả phòng thì mất luôn đơn của những ngày
                 khác. Ở đây đóng mở từng đêm một. -->
            <section class="pw-page" id="page-calendar">
                <div class="pw-tools">
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                        <label for="cal-listing" style="font-size:.9rem;color:var(--muted)">Chỗ nghỉ</label>
                        <select id="cal-listing" onchange="PartnerWorkspace.loadCalendar()"
                                style="padding:9px 12px;border:1px solid var(--line);border-radius:11px;font:inherit"></select>
                        <button class="pw-btn" onclick="PartnerWorkspace.doiThang(-1)">‹ Tháng trước</button>
                        <b id="cal-title" style="min-width:150px;text-align:center"></b>
                        <button class="pw-btn" onclick="PartnerWorkspace.doiThang(1)">Tháng sau ›</button>
                    </div>
                </div>
                <div id="cal-body"></div>
            </section>

            <!-- ── Đơn hàng ──
                 Trước đây bảng này chỉ ĐỌC: đối tác nhìn thấy đơn mới nhưng
                 không bấm nhận được, phải quay về trang giới thiệu mới xác
                 nhận được. Một kênh bán hàng mà không nhận được đơn ngay tại
                 chỗ thì coi như chưa xong. -->
            <section class="pw-page" id="page-orders">
                <div class="pw-tools">
                    <div class="pw-chips" id="or-chips"></div>
                    <input type="search" id="or-search" class="pw-search"
                           placeholder="Tìm theo tên khách, số điện thoại hoặc mã đơn"
                           oninput="PartnerWorkspace.renderOrders()">
                </div>
                <div class="pw-table-wrap"><table class="pw-table" id="or-table"></table></div>
            </section>

            <!-- ── Doanh thu ──
                 Khác Dòng tiền: chỗ kia là tiền vào tiền ra, chỗ này là tình
                 hình buôn bán — hơn kém tháng trước, ngày nào đông, món nào
                 ra tiền, món nào đăng rồi để đó. -->
            <section class="pw-page" id="page-revenue">
                <div class="pw-period">
                    <label for="rv-month" style="font-size:.9rem;color:var(--muted)">Kỳ</label>
                    <input type="month" id="rv-month" onchange="PartnerWorkspace.loadRevenue()">
                </div>
                <div class="pw-cards" id="rv-cards" style="margin-top:16px"></div>

                <div class="pw-block">
                    <h2>Doanh thu theo ngày</h2>
                    <div id="rv-chart"></div>
                </div>

                <div class="pw-two">
                    <div class="pw-block" style="margin-top:0">
                        <h2>Dịch vụ bán chạy</h2>
                        <div class="pw-table-wrap"><table class="pw-table" id="rv-services"></table></div>
                    </div>
                    <div class="pw-block" style="margin-top:0">
                        <h2>Chưa có đơn nào kỳ này</h2>
                        <div id="rv-idle"></div>
                    </div>
                </div>

                <div class="pw-block">
                    <h2>Từng đơn đã hoàn thành</h2>
                    <div class="pw-table-wrap"><table class="pw-table" id="rv-orders"></table></div>
                </div>
            </section>

            <!-- ── Đánh giá ── -->
            <section class="pw-page" id="page-reviews">
                <div class="pw-cards" id="rvw-cards"></div>
                <div class="pw-block">
                    <h2>Khách nói gì</h2>
                    <div class="pw-rvw-filters" id="rvw-filters"></div>
                    <div id="rvw-list"></div>
                </div>
            </section>

            <!-- ── Hồ sơ & nhận tiền ── -->
            <section class="pw-page" id="page-profile">
                <div id="pf-body"></div>
            </section>

            <!-- ── Dòng tiền ── -->
            <section class="pw-page" id="page-money">
                <div class="pw-period">
                    <label for="mn-month" style="font-size:.9rem;color:var(--muted)">Kỳ</label>
                    <input type="month" id="mn-month" onchange="PartnerWorkspace.loadMoney()">
                </div>
                <div class="pw-cards" id="mn-cards" style="margin-top:16px"></div>
                <div class="pw-note" id="mn-note"></div>
                <div class="pw-block">
                    <h2>Chi tiết từng khoản</h2>
                    <div class="pw-table-wrap"><table class="pw-table" id="mn-table"></table></div>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="js/auth-token.js?v=2"></script>
    <script src="js/listing.js?v=6"></script>
<script src="js/partner-workspace.js?v=9"></script>
<script>lucide.createIcons();</script>
</body>
</html>
