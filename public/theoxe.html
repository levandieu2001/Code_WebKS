<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi xe | LOCALMATE</title>
<link rel="icon" href="/assets/favicon.png">
<style>
/* Trang này dùng chung cho web và app (app mở bằng WebView), nên tự chứa
   toàn bộ CSS — không phụ thuộc styles.css của web để hiển thị luôn giống nhau. */
:root{
    --forest:#1D2214; --sand:#F5EAD8; --cream:#FFFBF4; --terracotta:#C67139;
    --gold:#D7B46A; --ink:#27291F; --muted:#6F7168; --success:#3E7C59;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
    font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--sand); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;
}

/* ── Bản đồ ── */
.livemap{
    position:relative; flex:1; min-height:0; overflow:hidden;
    background:#dfe6d5; cursor:grab; touch-action:none;
}
.livemap:active{cursor:grabbing}
.livemap-tiles,.livemap-pins{position:absolute; inset:0}
.livemap-pins{pointer-events:none}
.livemap-tiles img{
    position:absolute; top:0; left:0; width:256px; height:256px;
    will-change:transform; user-select:none; -webkit-user-drag:none;
}

.livemap-pin{position:absolute; top:0; left:0; will-change:transform}
.livemap-pin>*{position:absolute; transform:translate(-50%,-50%)}

/* Ghim điểm đón/đến */
.livemap-dot{
    width:18px; height:18px; border-radius:50%;
    background:var(--terracotta); border:3px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.livemap-label{
    top:-26px; white-space:nowrap; font-size:12px; font-weight:600;
    background:#fff; color:var(--ink); padding:3px 9px; border-radius:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

/* Icon xe: mũi tên quay theo hướng đang chạy + vòng sóng cho dễ thấy */
.livemap-pin--car svg{
    width:38px; height:38px; fill:var(--forest);
    stroke:#fff; stroke-width:1.6; stroke-linejoin:round;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
    transition:transform .6s ease-out;
}
.livemap-pulse{
    width:54px; height:54px; border-radius:50%;
    background:rgba(198,113,57,.28); animation:pulse 2s ease-out infinite;
}
@keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(.5); opacity:.9}
    100%{transform:translate(-50%,-50%) scale(1.5); opacity:0}
}

.livemap-zoom{position:absolute; right:12px; bottom:96px; display:grid; gap:6px}
.livemap-zoom button{
    width:40px; height:40px; border:0; border-radius:12px; background:#fff;
    font-size:22px; line-height:1; color:var(--ink); cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.livemap-recenter{
    position:absolute; left:50%; transform:translateX(-50%); bottom:20px;
    border:0; border-radius:22px; padding:10px 18px; cursor:pointer;
    background:var(--forest); color:#fff; font-size:14px; font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.livemap-credit{
    position:absolute; right:6px; bottom:4px; font-size:10px;
    color:#4a4a4a; background:rgba(255,255,255,.75);
    padding:1px 6px; border-radius:6px;
}

/* ── Thanh thông tin ── */
.panel{
    background:var(--forest); color:#fff; padding:18px 20px 22px;
    border-radius:22px 22px 0 0; margin-top:-22px; position:relative; z-index:2;
    box-shadow:0 -6px 24px rgba(0,0,0,.25);
}
.panel h1{font-size:18px; font-weight:700; margin-bottom:6px}
.panel .who{color:var(--gold); font-size:14px; margin-bottom:10px}
.panel .eta{font-size:26px; font-weight:800; letter-spacing:-.5px}
.panel .eta small{font-size:14px; font-weight:500; opacity:.75}
.panel .warn{color:var(--gold); font-size:13px; margin-top:8px}
.panel .row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
.panel a.btn,.panel button.btn{
    flex:1; min-width:120px; text-align:center; text-decoration:none;
    border:0; border-radius:14px; padding:13px 14px; cursor:pointer;
    font-size:15px; font-weight:600; font-family:inherit;
}
.btn--gold{background:var(--gold); color:var(--forest)}
.btn--ghost{background:rgba(255,255,255,.14); color:#fff}
.loading{padding:40px 20px; text-align:center; color:var(--muted)}
.missing-map{
    position:absolute; inset:0; display:grid; place-items:center; padding:24px;
    background:linear-gradient(155deg,#e8efe0,#d8e2ce);
}
.missing-card{
    width:min(390px,100%); padding:24px; border-radius:20px; text-align:center;
    background:rgba(255,255,255,.94); box-shadow:0 14px 40px rgba(29,34,20,.14);
}
.missing-card h1{font-size:20px; margin-bottom:9px}
.missing-card p{font-size:14px; line-height:1.65; color:var(--muted); margin-bottom:17px}
.missing-card a{
    display:inline-flex; align-items:center; justify-content:center; min-height:46px;
    padding:11px 18px; border-radius:14px; background:var(--forest); color:#fff;
    text-decoration:none; font-size:14px; font-weight:700;
}
</style>
</head>
<body class="lm">
    <div id="map" class="livemap"></div>

    <section class="panel" id="panel">
        <div class="loading" id="loading">Đang tìm vị trí xe…</div>
        <div id="info" hidden>
            <h1 id="stage">Tài xế đang trên đường tới đón bạn</h1>
            <div class="who" id="who"></div>
            <div class="eta" id="eta"></div>
            <div class="warn" id="warn" hidden></div>
            <div class="row">
                <a class="btn btn--gold" id="call" href="#">Gọi tài xế</a>
                <button class="btn btn--ghost" type="button" id="refresh">Cập nhật ngay</button>
            </div>
        </div>
    </section>

<script type="module">
import { trackBooking } from '/js/livemap.js';

const params = new URLSearchParams(location.search);
let bookingId = params.get('id') || '';

// Nếu khách vừa đặt xe rồi vô tình mở trang theo dõi không kèm id, dùng lại
// đúng đơn xe gần nhất trên thiết bị này. Không có đơn gần nhất thì hiện lối
// sang trang tra cứu, thay vì để gần trọn màn hình là một mảng xanh trống.
if (!bookingId) {
    try {
        const recent = JSON.parse(localStorage.getItem('localmate_last_booking') || 'null');
        if (recent && recent.kind === 'transport' && recent.id) bookingId = String(recent.id);
    } catch (_) { /* Dữ liệu cũ hỏng hoặc trình duyệt chặn lưu trữ. */ }
}

// Ở chế độ nhúng, cả thanh thông tin lẫn dòng "đang tải" đều bị gỡ khỏi trang.
// Mọi chỗ bên dưới phải đi qua hàm này, nếu không sẽ gán chữ vào null rồi văng
// lỗi ngay giữa vòng cập nhật — mà lỗi đó lại bị catch nuốt mất, bản đồ đứng im
// không hiểu vì sao.
const $ = (id) => document.getElementById(id);
const setText = (id, text) => { const el = $(id); if (el) el.textContent = text; };
const setHtml = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };
const setHidden = (id, hidden) => { const el = $(id); if (el) el.hidden = hidden; };

// Chế độ nhúng: trang "Đơn của tôi" đã in sẵn tên tài xế và số km ngay trên
// thẻ đơn, nên khi nhúng vào đó thì giấu thanh thông tin đi cho khỏi lặp,
// chỉ chừa mỗi bản đồ.
if (params.get('embed') === '1') {
    $('panel')?.remove();
    document.body.style.background = 'transparent';
}

if (!bookingId) {
    $('panel')?.remove();
    const map = $('map');
    if (map) map.innerHTML = `
        <div class="missing-map">
            <div class="missing-card">
                <h1>Chưa chọn chuyến xe</h1>
                <p>Mở “Đơn của tôi”, nhập số điện thoại đã dùng khi đặt rồi chọn chuyến cần theo dõi. Mã đơn nằm ngay trên từng đơn.</p>
                <a href="/donhang.html">Mở Đơn của tôi</a>
            </div>
        </div>`;
} else {
    const stop = trackBooking($('map'), bookingId, (data) => {
        if (!data.tracking) {
            setText('loading', data.message
                || 'Tài xế chưa bắt đầu chuyến. Bạn sẽ thấy xe chạy trên bản đồ khi họ lên đường.');
            return;
        }

        setHidden('loading', true);
        setHidden('info', false);

        setText('stage', data.stage_label || 'Tài xế đang trên đường');
        setText('who', [data.driver_name, data.plate].filter(Boolean).join(' · '));

        // Chỉ hiện quãng đường khi máy chủ tính được, không bịa số cho khách
        if (data.remaining_km != null && data.eta_minutes != null) {
            setHtml('eta', `${String(data.remaining_km).replace('.', ',')} km `
                + `<small>·</small> ${data.eta_minutes} <small>phút nữa</small>`);
        } else {
            setText('eta', '');
        }

        setHidden('warn', !data.stale);
        if (data.stale) setText('warn', 'Tài xế đang mất sóng, vị trí có thể chưa cập nhật.');

        const call = $('call');
        if (call) {
            if (data.driver_phone) { call.href = `tel:${data.driver_phone}`; call.hidden = false; }
            else { call.hidden = true; }
        }
    });

    $('refresh')?.addEventListener('click', () => location.reload());
    window.addEventListener('pagehide', stop);
}
</script>
</body>
</html>
