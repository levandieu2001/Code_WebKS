<style>
/* ══ Cài đặt tài khoản ══
   Hai khối: thông tin cá nhân, và sổ địa chỉ. Sổ địa chỉ chứ không phải một
   dòng địa chỉ duy nhất — người ta hay gửi về nhà mình, mà cũng hay gửi biếu
   về quê hay gửi tới cơ quan. Ép chọn một là lần sau lại gõ tay. */
.tk-wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 90px; }
.tk-head { margin-bottom: 26px; }
.tk-head h1 { font-size: clamp(24px, 3.4vw, 32px); margin: 0 0 8px; color: var(--lm-ink, #16233a); }
.tk-head p { margin: 0; color: var(--lm-muted, #7a879c); font-size: 14.5px; line-height: 1.7; }

.tk-khoi { background: #fff; border: 1px solid var(--lm-line, #e3e9f2);
    border-radius: var(--lm-r-lg, 20px); padding: 22px; margin-bottom: 20px; }
.tk-khoi h2 { font-size: 18px; margin: 0 0 4px; color: var(--lm-ink, #16233a); }
.tk-khoi > p { margin: 0 0 18px; font-size: 13.5px; color: var(--lm-muted, #7a879c);
    line-height: 1.7; }

.tk-luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px,100%),1fr));
    gap: 14px; }
.tk-f label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px;
    color: var(--lm-ink, #16233a); }
.tk-f input, .tk-f textarea { width: 100%; padding: 11px 13px; font: inherit; font-size: 14.5px;
    border: 1.5px solid var(--lm-line, #e3e9f2); border-radius: 11px; background: #fff;
    color: var(--lm-ink, #16233a); }
.tk-f input:focus, .tk-f textarea:focus { outline: none; border-color: var(--lm-blue, #0f6fd0); }
.tk-f input:disabled { background: var(--lm-bg-soft, #f6f9fd); color: var(--lm-muted, #7a879c); }
.tk-f small { display: block; margin-top: 5px; font-size: 12px; color: var(--lm-muted, #7a879c);
    line-height: 1.6; }
.tk-luu { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
.tk-bao { font-size: 13.5px; }
.tk-bao.ok { color: #128a3e; }
.tk-bao.loi { color: #c0392b; }

/* Sổ địa chỉ */
.tk-dc { border: 1.5px solid var(--lm-line, #e3e9f2); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; }
.tk-dc.mac-dinh { border-color: var(--lm-blue, #0f6fd0);
    background: var(--lm-blue-soft, #eaf4fe); }
.tk-dc-top { display: flex; justify-content: space-between; gap: 12px;
    align-items: flex-start; flex-wrap: wrap; }
.tk-dc-nhan { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: var(--lm-blue, #0f6fd0); color: #fff; }
.tk-dc b { font-size: 15px; color: var(--lm-ink, #16233a); }
.tk-dc .sdt { font-size: 13.5px; color: var(--lm-muted, #7a879c); }
.tk-dc p { margin: 8px 0 0; font-size: 14px; line-height: 1.7; color: var(--lm-body, #46536b); }
.tk-dc-nut { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tk-dc-nut button { border: 1px solid var(--lm-line, #e3e9f2); background: #fff;
    border-radius: 9px; padding: 7px 13px; cursor: pointer; font: inherit;
    font-size: 12.8px; font-weight: 600; color: var(--lm-body, #46536b); }
.tk-dc-nut button:hover { border-color: var(--lm-blue, #0f6fd0); color: var(--lm-blue, #0f6fd0); }
.tk-dc-nut button.xoa:hover { border-color: #c0392b; color: #c0392b; }

.tk-trong { padding: 28px 20px; text-align: center; border-radius: 14px;
    background: var(--lm-bg-soft, #f6f9fd); color: var(--lm-muted, #7a879c);
    line-height: 1.75; font-size: 14px; }

.tk-cong { display: grid; place-items: center; padding: 70px 20px; text-align: center; }
.tk-cong h2 { font-size: 22px; margin: 0 0 10px; color: var(--lm-ink, #16233a); }
.tk-cong p { color: var(--lm-muted, #7a879c); line-height: 1.75; margin: 0 0 20px;
    max-width: 420px; }
</style>
</head>
