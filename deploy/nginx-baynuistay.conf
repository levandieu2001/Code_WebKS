# ============================================================
# Bay Nui Stay — cau hinh nginx
# ============================================================
# Nginx dung truoc Node, lam ba viec:
#   1. Nhan HTTPS (chung chi Let's Encrypt do certbot cap va tu gia han).
#   2. Chuyen tiep sang Node dang chay o cong 3000.
#   3. Phuc vu anh doi tac tai len tu o dia rieng, khong qua Node cho nhe.
#
# Dat file nay tai: /etc/nginx/sites-available/baynuistay
# roi tao lien ket sang /etc/nginx/sites-enabled/
# ============================================================

server {
    server_name localmate.click www.localmate.click;

    # certbot se tu them phan chuyen huong sang HTTPS vao day.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Node doc mấy header nay de biet dia chi that cua khach va biet trang
        # dang chay tren https. Thieu X-Forwarded-Proto thi server.js sinh ra
        # duong dan anh http:// trong khi trang la https:// — dien thoai chan
        # het, ket qua la MAT SACH ANH ma khong bao loi gi.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
    }

    # File cai dat app. Nginx phuc vu thang tu o dia, khong qua Node — file
    # 25 MB ma di qua Node thi tac ca may chu trong luc khach tai.
    #
    # Nam o /var/lib chu khong nam trong thu muc ma nguon: cap nhat web la keo
    # ma moi de len, de trong do thi moi lan cap nhat lai mat file APK va moi
    # nguoi dang tai do bi dut giua chung.
    location /tai-app/ {
        alias /var/lib/baynuistay/apk/;
        # Bao trinh duyet TAI VE chu dung mo ra
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/vnd.android.package-archive";
        # Dung cache: ban moi phai toi duoc may khach ngay
        add_header Cache-Control "no-store";
        access_log off;
    }

    # Anh doi tac tai len — nginx doc thang tu o dia, khong lam phien Node.
    location /uploads/ {
        alias /var/lib/baynuistay/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Anh phong thuong 1–3 MB, chua ke anh dien thoai doi moi. Mac dinh cua
    # nginx la 1 MB — de nguyen thi doi tac tai anh len bi chan voi loi 413.
    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/baynuistay.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/baynuistay.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot






}


server {
    if ($host = www.localmate.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = localmate.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name localmate.click www.localmate.click;
    return 404; # managed by Certbot








}

# ============================================================
# Ten mien cu — chi con chi duong
# ============================================================
# baynuistay.me khong con phuc vu trang nua. Ai con giu duong cu — ma QR tren
# ho chieu, tin nhan da gui, danh thiep da in — vao day se duoc day thang sang
# localmate.click, giu nguyen ca duong dan phia sau.
#
# VAN phai giu chung chi HTTPS cho no: khong co chung chi thi trinh duyet chan
# ngay o buoc bat tay, chua kip doc lenh chuyen huong nao — khach thay man hinh
# do canh bao bao mat chu khong phai trang moi.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baynuistay.me www.baynuistay.me;

    ssl_certificate /etc/letsencrypt/live/baynuistay.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baynuistay.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://localmate.click$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name baynuistay.me www.baynuistay.me;
    return 301 https://localmate.click$request_uri;
}
